name: Close stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale items
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: This issue has been inactive for 60 days and will be closed in 14 days if there is no further activity.
          close-issue-message: Closing this issue because it has been stale for 14 days.
          stale-pr-message: This pull request has been inactive for 60 days and will be closed in 14 days if there is no further activity.
          close-pr-message: Closing this pull request because it has been stale for 14 days.
          exempt-issue-labels: pinned,security,keep-open
          exempt-pr-labels: pinned,security,keep-open
